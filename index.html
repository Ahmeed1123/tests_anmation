   <!DOCTYPE html>
      <html>
        <head>
            <title> My porject new Test</title>
            <style>
               * {
                  box-sizing: border-box;
                  margin: 0;
                  padding: 0;
                  font-family: Arial, sans-serif;
               }
               body {
                  height: 100dvh;
                  display: flex;
                  justify-content: center;
                  align-items: center;
                  flex-direction: column;
                  transition: 3s all linear;
                  animation-name: animation_bg;
                  animation-duration: 3s;
                  animation-iteration-count: infinite;
               }
               @keyframes animation_bg {
                  from {
                     background-color: #fff;
                  }

                  50% {
                     background-color: #000;
                  }
                  to {
                     background-color: #fff;
                  }
               }
               .tests-animation {
                  width: 100%;
                  height: 100%;
               }
            </style>
        </head>

    <body>
         <div class="tests-animation"></div>
    </body> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js" integrity="sha512-jEnuDt6jfecCjthQAJ+ed0MTVA++5ZKmlUcmDGBv2vUI/REn6FuIdixLNnQT+vKusE2hhTk2is3cFvv5wA+Sgg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
      var element = document.querySelector('.tests-animation');
      console.log(lottie);
         lottie.loadAnimation({
            container: element, // the dom element that will contain the animation
            renderer: 'svg',
            loop: true,
            autoplay: true,
            path: './flow.json' // the path to the animation json
         });
    </script>

</html>
